[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freshpick-rocm"
version = "0.1.0"
description = "ROCm training pipeline for the FreshPick produce freshness dataset"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "Pillow>=10,<12",
  "scikit-learn>=1.5,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
