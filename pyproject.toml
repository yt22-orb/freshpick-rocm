[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freshpick-rocm"
version = "0.3.0"
description = "ROCm training pipeline for the FreshPick produce freshness dataset"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "Pillow>=10,<12",
  "scikit-learn>=1.5,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
identifier = ["open_clip_torch==3.3.0"]
browser = ["playwright>=1.50,<2"]
evaluation = ["matplotlib>=3.8,<4", "requests>=2.32,<3"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freshpick = ["photo_calibration.json", "shelf_life_reference.json"]
